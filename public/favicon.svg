<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Luxury Dark Obsidian Gradient -->
    <linearGradient id="obsidianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Luxury Titanium Platinum Gradient -->
    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Luxury Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7B58"/>
      <stop offset="50%" stop-color="#FF4D2D"/>
      <stop offset="100%" stop-color="#C42F13"/>
    </linearGradient>

    <!-- Hairline Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#64748B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF4D2D" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Ambient Shadow Glow -->
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF4D2D" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Luxury Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="32" fill="url(#obsidianGrad)" filter="url(#luxuryGlow)"/>
  <rect x="6" y="6" width="116" height="116" rx="32" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Subtle Inner Specular Light -->
  <path d="M 12 36 C 12 22 22 12 36 12 L 92 12 C 70 12 20 28 12 70 Z" fill="#FFFFFF" opacity="0.06"/>

  <!-- Architectural Luxury Monogram "T" with Precision Faceted Cuts -->
  <g>
    <!-- Top Horizontal Crossbar with 45deg Beveled Ends -->
    <path d="M 24 32 L 104 32 L 100 46 L 73 46 L 73 98 L 55 98 L 55 46 L 28 46 Z" fill="url(#platinumGrad)"/>
    
    <!-- Precision Inner Facet Highlight -->
    <path d="M 28 32 L 100 32 L 96 36 L 32 36 Z" fill="#FFFFFF" opacity="0.6"/>
    <path d="M 55 46 L 64 46 L 64 98 L 55 98 Z" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <!-- Luxury Diamond Sparkle Star (✦) -->
  <g transform="translate(98, 28)">
    <circle cx="0" cy="0" r="4.5" fill="url(#goldAccent)"/>
    <path d="M 0 -8 L 1.5 -2 L 7.5 0 L 1.5 2 L 0 8 L -1.5 2 L -7.5 0 L -1.5 -2 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
